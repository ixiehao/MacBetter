  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eaf3fa"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="22" flood-color="#17324d" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="92" r="205" fill="#dcecf8" opacity=".7"/>
  <circle cx="1130" cy="545" r="175" fill="#e2f0ed" opacity=".75"/>
