  <text x="68" y="259" fill="#17283d" font-family="PingFang SC, Noto Sans CJK SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="88" font-weight="780" letter-spacing="-5">让 Mac 更好用</text>
  <text x="74" y="321" fill="#536477" font-family="PingFang SC, Noto Sans CJK SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="27" font-weight="500">免费 · 开源 · 按用途整理 · 真实使用推荐</text>
  <g filter="url(#shadow)">
